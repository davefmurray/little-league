<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Little League 32 — Password Screen</title>
<style>
  :root{
    --bg:#0b0d10; --panel:#11151b; --line:#243040; --fg:#e8eef7;
    --muted:#8a97a8; --green:#48d17a; --amber:#f2b134; --red:#e5484d;
    --blue:#4c9aff; --mono:"SF Mono",ui-monospace,Menlo,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--mono)}
  body{padding:18px 0 28px}
  .wrap{max-width:728px;margin:0 auto;padding:0 4px}
  h1{font-size:18px;letter-spacing:.16em;margin:0 0 2px}
  .sub{color:var(--muted);font-size:11px;letter-spacing:.08em;margin-bottom:16px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
  .label{font-size:10px;letter-spacing:.18em;color:var(--muted);margin-bottom:8px}
  .slots{display:grid;grid-template-columns:repeat(16,1fr);gap:4px}
  .slot{aspect-ratio:1/1.25;display:flex;align-items:center;justify-content:center;
        background:#0a0f14;border:1px solid var(--line);border-radius:4px;
        font-size:18px;font-weight:700;color:var(--amber)}
  .meta{display:flex;gap:18px;flex-wrap:wrap;margin-top:10px;font-size:11px;color:var(--muted)}
  .meta b{color:var(--fg);font-weight:600}
  .legend{font-size:10px;color:var(--muted);margin-top:8px;letter-spacing:.06em}
  .legend span{color:var(--amber)}
  .rounds{display:grid;grid-template-columns:1.6fr 1fr .7fr .5fr .4fr;gap:8px}
  .rnd{min-width:0}
  .rnd h3{font-size:9px;letter-spacing:.14em;color:var(--muted);margin:0 0 6px;font-weight:600}
  .match{background:#0a0f14;border:1px solid var(--line);border-radius:4px;padding:3px 5px;margin-bottom:4px;font-size:10px;line-height:1.35}
  .match .w{color:var(--green)} .match .l{color:#59657a}
  .match .sc{float:right;color:var(--muted)}
  .champ{margin-top:10px;display:flex;align-items:center;gap:8px;font-size:12px}
  .champ .tag{font-size:9px;letter-spacing:.14em;color:var(--muted)}
  .champ .name{color:var(--amber);font-weight:700;letter-spacing:.06em}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:11px;color:var(--muted)}
  input{background:#0a0f14;border:1px solid var(--line);color:var(--fg);border-radius:4px;
        padding:5px 7px;font-family:var(--mono);font-size:11px;width:110px}
  button{background:#182130;border:1px solid var(--line);color:var(--fg);border-radius:4px;
         padding:5px 10px;font-family:var(--mono);font-size:11px;cursor:pointer}
  button:hover{border-color:var(--blue)}
  .status{font-size:10px;color:var(--green);min-height:14px}
</style>
</head>
<body>
<div class="wrap">
  <h1>LITTLE LEAGUE 32 &mdash; PASSWORD</h1>
  <div class="sub">32-team / 5-round state &mdash; 8 bytes &mdash; 16 characters</div>

  <div class="panel">
    <div class="label">PASSWORD</div>
    <div class="slots" id="slots"></div>
    <div class="meta">
      <div>SEED <b id="seed">—</b></div>
      <div>RESULTS <b id="results">—</b></div>
      <div>VERSION <b id="version">—</b></div>
      <div>HEX <b id="hex">—</b></div>
    </div>
    <div class="legend">ALPHABET <span>5 7 H J K M O Q S U e g h j l n</span></div>
    <div class="row" style="margin-top:10px">
      <input id="seedIn" value="12345678" spellcheck="false">
      <button id="go">LOAD</button>
      <button id="newSeed">NEW</button>
      <span class="status" id="status"></span>
    </div>
  </div>

  <div class="panel">
    <div class="label">BRACKET FROM PASSWORD</div>
    <div class="rounds" id="rounds"></div>
    <div class="champ"><span class="tag">CHAMPION</span><span class="name" id="champ">—</span></div>
  </div>
</div>

<script>
const NAMES = [
  "JAPAN","ARIZONA","PENNSYLVANIA","CHINESE TAIPEI","KOREA","NEW YORK",
  "CALIFORNIA","TEXAS","HAWAII","SPAIN","PUERTO RICO","MEXICO","CANADA",
  "ITALY","ILLINOIS","FLORIDA","AUSTRALIA","CUBA","DOMINICAN REP",
  "VENEZUELA","PANAMA","NETHERLANDS","GERMANY","SOUTH AFRICA","BRAZIL",
  "COLOMBIA","NICARAGUA","PHILIPPINES","HONG KONG","GUAM","NEW ZEALAND",
  "CZECH REPUBLIC"
];
const ABBR = ["JPN","ARI","PEN","TPE","KOR","NY","CAL","TEX","HAW","ESP","PUR",
  "MEX","CAN","ITA","ILL","FLA","AUS","CUB","DOM","VEN","PAN","NED","GER","RSA",
  "BRA","COL","NCA","PHI","HKG","GUM","NZL","CZE"];
const ALPHA = "57HJKMOQSUeghjln";

function xorshift32(s){
  s = s >>> 0;
  s ^= (s << 13) >>> 0; s >>>= 0;
  s ^= s >>> 17; s >>>= 0;
  s ^= (s << 5) >>> 0; s >>>= 0;
  return s >>> 0;
}
function seedOrder(seed){
  let s = (seed >>> 0) || 0x9E3779B9;
  const o = Array.from({length:32}, (_, i) => i);
  for (let i = 31; i > 0; i--){
    s = xorshift32(s);
    const j = s % (i + 1);
    const t = o[i]; o[i] = o[j]; o[j] = t;
  }
  return o;
}
function advance(order, results){
  const slots = order.concat(Array(31).fill(null));
  for (let m = 0; m < 31; m++){
    const a = slots[2*m], b = slots[2*m+1];
    if (a == null || b == null) throw new Error("empty slot at match " + m);
    slots[32+m] = ((results >>> m) & 1) ? a : b;
  }
  return slots;
}
function encode(seed, results){
  const bits = ((results >>> 0) & 0x7FFFFFFF) | (1 << 31);
  const raw = new Uint8Array(8);
  const dv = new DataView(raw.buffer);
  dv.setUint32(0, seed >>> 0, true);
  dv.setUint32(4, bits >>> 0, true);
  return [...raw].map(b => b.toString(16).padStart(2, "0")).join("");
}
function decodeHex(hex){
  const raw = new Uint8Array(8);
  for (let i = 0; i < 8; i++) raw[i] = parseInt(hex.substr(i*2, 2), 16);
  const dv = new DataView(raw.buffer);
  return [dv.getUint32(0, true), dv.getUint32(4, true) & 0x7FFFFFFF];
}
function toChars(hex){
  return [...hex].map(c => ALPHA[parseInt(c, 16)]).join("");
}

let seed = 0x12345678, results = 0;

function draw(){
  const hex = encode(seed, results);
  const chars = toChars(hex);
  document.getElementById("slots").innerHTML =
    [...chars].map(c => `<div class="slot">${c}</div>`).join("");
  document.getElementById("seed").textContent = "0x" + (seed >>> 0).toString(16).toUpperCase().padStart(8, "0");
  document.getElementById("results").textContent = "0x" + (results >>> 0).toString(16).toUpperCase().padStart(8, "0");
  document.getElementById("version").textContent = "32-TEAM / V1";
  document.getElementById("hex").textContent = hex;

  const order = seedOrder(seed);
  const slots = advance(order, results);

  const rounds = [[0,16],[16,8],[8,4],[4,2],[2,1]];
  const titles = ["ROUND OF 32","ROUND OF 16","QUARTERFINALS","SEMIFINALS","FINAL"];
  document.getElementById("rounds").innerHTML = rounds.map(([start, count], ri) => {
    let items = "";
    for (let m = 0; m < count; m++){
      const i = start + m;
      const a = slots[2*i], b = slots[2*i+1];
      const w = slots[32+i];
      items += `<div class="match"><span class="${w===a?'w':'l'}">${ABBR[a]}</span> ` +
               `<span class="${w===b?'w':'l'}">${ABBR[b]}</span>` +
               `<span class="sc">${w===a?'W':'&nbsp;'}</span></div>`;
    }
    return `<div class="rnd"><h3>${titles[ri]}</h3>${items}</div>`;
  }).join("");
  document.getElementById("champ").textContent = NAMES[slots[62]] + " (" + ABBR[slots[62]] + ")";
}

function loadSeed(){
  const v = document.getElementById("seedIn").value.trim().replace(/^0x/i, "");
  const n = parseInt(v, 16);
  if (!Number.isFinite(n)) { document.getElementById("status").textContent = "bad seed"; return; }
  seed = n >>> 0;
  results = 0;
  document.getElementById("status").textContent = "seed loaded";
  draw();
}
document.getElementById("go").addEventListener("click", loadSeed);
document.getElementById("newSeed").addEventListener("click", () => {
  seed = (Math.random()*0xFFFFFFFF) >>> 0;
  results = 0;
  document.getElementById("seedIn").value = seed.toString(16).padStart(8, "0");
  document.getElementById("status").textContent = "new seed";
  draw();
});
document.getElementById("seedIn").addEventListener("keydown", e => { if (e.key === "Enter") loadSeed(); });

draw();
</script>
</body>
</html>
