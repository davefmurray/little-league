<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>32-team password mockup</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--font-sans,ui-sans-serif,system-ui,sans-serif);
       color:var(--foreground,#e8e8e8);background:transparent}
  .panel{max-width:640px;margin:0 auto;padding:18px 18px 14px;
         border:1px solid var(--border,#333);border-radius:var(--radius,12px);
         background:var(--card,#151515)}
  h1{font-size:15px;letter-spacing:.22em;margin:0 0 4px;color:var(--accent,#ffb000)}
  .sub{margin:0 0 14px;font-size:12px;color:var(--muted-foreground,#999)}
  .tiles{display:flex;gap:5px;justify-content:center;margin:16px 0}
  .tile{width:42px;height:52px;border:1px solid var(--border,#3a3a3a);
        border-radius:6px;background:var(--secondary,#1d1d1d);
        display:grid;place-items:center;font:700 24px/1 var(--font-mono,monospace);
        color:var(--accent,#ffb000)}
  .tile.bad{border-color:var(--destructive,#e5484d);color:var(--destructive,#e5484d)}
  .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  button{font:600 12px var(--font-sans,sans-serif);padding:8px 14px;border-radius:8px;
         border:1px solid var(--border,#3a3a3a);background:var(--secondary,#1d1d1d);
         color:var(--foreground,#e8e8e8);cursor:pointer}
  button.primary{background:var(--primary,#e8e8e8);color:var(--primary-foreground,#111);
                 border-color:transparent}
  #status{min-height:18px;text-align:center;font-size:12px;margin:12px 0 0;
          color:var(--muted-foreground,#999)}
  #status.ok{color:var(--success,#3fb950)}
  #status.err{color:var(--destructive,#e5484d)}
  .legend{display:flex;gap:14px;justify-content:center;margin-top:12px;
          font-size:11px;color:var(--muted-foreground,#888)}
  code{font-family:var(--font-mono,monospace);color:var(--foreground,#ddd)}
</style>
</head>
<body>
<div class="panel">
  <h1>32-TEAM PASSWORD</h1>
  <p class="sub">11-character screen · base-32 · 16-bit seed + 31-bit results + version</p>
  <div class="tiles" id="tiles"></div>
  <div class="row">
    <button class="primary" id="new">New code</button>
    <button id="check">Verify checksum</button>
  </div>
  <p id="status"></p>
  <div class="legend">
    <span>10 data chars</span><span>1 XOR checksum</span><span>needs 32 glyphs</span>
  </div>
</div>
<script>
const B32 = "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";
function encode(seed16, results) {
  const bits = seed16 + results * 0x10000 + 2 ** 47;
  let out = "";
  for (let i = 0; i < 10; i++) {
    out += B32[Math.floor(bits / 2 ** (5 * (9 - i))) % 32];
  }
  let check = 0;
  for (const c of out) check ^= B32.indexOf(c);
  return out + B32[check];
}
function decode(text) {
  if (text.length !== 11) throw new Error("need 11 chars");
  let check = 0;
  for (const c of text.slice(0, 10)) check ^= B32.indexOf(c);
  if (B32.indexOf(text[10]) !== check) throw new Error("checksum mismatch");
  let bits = 0;
  for (const c of text.slice(0, 10)) bits = bits * 32 + B32.indexOf(c);
  if (!(Math.floor(bits / 2 ** 47) & 1)) throw new Error("version bit missing");
  return { seed: bits % 0x10000,
           results: Math.floor(bits / 0x10000) & 0x7fffffff };
}
let current = "";
function draw(text, bad = false) {
  current = text;
  const tiles = document.getElementById("tiles");
  tiles.innerHTML = "";
  [...text].forEach((c, i) => {
    const d = document.createElement("div");
    d.className = "tile" + (bad && i === 10 ? " bad" : "");
    d.textContent = c;
    tiles.appendChild(d);
  });
}
function make() {
  const seed = (Math.random() * 0xffff) | 0;
  const results = (Math.random() * 0x7fffffff) | 0;
  draw(encode(seed, results));
  const s = document.getElementById("status");
  s.className = "";
  s.textContent = "seed 0x" + seed.toString(16).padStart(4, "0") +
    " · results 0x" + results.toString(16).padStart(8, "0");
}
document.getElementById("new").onclick = make;
document.getElementById("check").onclick = () => {
  const s = document.getElementById("status");
  try {
    const r = decode(current);
    s.className = "ok";
    s.textContent = "checksum OK · seed 0x" + r.seed.toString(16).padStart(4, "0") +
      " · results 0x" + r.results.toString(16).padStart(8, "0");
    draw(current, false);
  } catch (e) {
    s.className = "err";
    s.textContent = e.message;
    draw(current, true);
  }
};
make();
</script>
</body>
</html>
