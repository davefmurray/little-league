name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tools:
    name: Tooling and data checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install py65
        run: python -m pip install --quiet py65

      - name: Byte-compile tools
        run: |
          python - <<'PY'
          import compileall
          ok = compileall.compile_dir("tools", quiet=1)
          raise SystemExit(0 if ok else 1)
          PY

      - name: Validate team metadata
        run: |
          python - <<'PY'
          import json
          teams = json.load(open("data/teams32.json"))["teams"]
          assert len(teams) == 32, len(teams)
          assert [t["id"] for t in teams] == list(range(32))
          assert all(t["code"] and t["name"] and t["region"] for t in teams)
          assert not any(t.get("placeholder") for t in teams), "placeholder team remains"
          print("teams32.json OK:", len(teams), "teams")
          web = json.load(open("web/teams32.json"))["teams"]
          assert web == teams, "web/teams32.json is out of sync"
          print("web/teams32.json matches data/teams32.json")
          PY

      - name: Generate 32-team roster and validate
        run: |
          python tools/gen_roster32.py data/roster.json data/teams32.json \
            -o /tmp/roster32.json
          python - <<'PY'
          import json
          doc = json.load(open("/tmp/roster32.json"))
          assert len(doc["teams"]) == 32
          for t in doc["teams"]:
              stored = 15 if t["id"] < 16 else 20
              assert len(t["players"]) == stored, (t["name"], len(t["players"]))
              for p in t["players"]:
                  assert len(p["attrs"]) == 10
                  assert len(p["name"]) <= 6
          print("roster32.json OK: teams 0-15 x 15, teams 16-31 x 20")
          PY

      - name: Verify 32-team password model
        run: python3 tools/password32.py test

      - name: Test 32-team roster CLI
        run: python3 tools/test_roster32.py
      - name: Bracket 32 table
        run: python3 tools/test_bracket32.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax-check the browser editor
        run: |
          node --check web/app.js
          node --check web/rom.js
          node --check web/colors.js

      # CI has no ROM, so the real-ROM cases in the editor, CLI and CPU tests report as skipped.
      - name: Test the browser editor
        run: node --test --test-timeout=60000 tools/test_web_rom.mjs tools/test_web_app.mjs tools/test_web_colors.mjs

      - name: Test the roster CLI's team colors
        run: python3 tools/test_roster.py

      - name: Run the exported palette routine on the CPU model
        run: python3 tools/test_colors32.py
